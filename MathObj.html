<html><script>
    let m=Math
    console.log(m)
    console.log("the math value of E is",Math.E)
    console.log("the math value of PI is",Math.PI)
    console.log("the math value of LN2 is",Math.LN2)
    console.log("the math value of SQRT1_2 is",Math.SQRT1_2)
    console.log("the math value of LOG2E is",Math.LOG2E)
  

        let a=1.2345
        let b=123
        console.log(a,b)
        // round
        console.log(Math.round(a),Math.round(b))
        // power
        console.log(Math.pow(3,2))
        // square root
        console.log(Math.sqrt(81))
        // ceil and floor
        console.log(Math.ceil(5.3))  //up 6
        console.log(Math.floor(5.7))  // down 5
        // absolute
        console.log(Math.abs(5.77))
        console.log(Math.abs(-5.77))
        // Trignometric function 
        console.log(Math.sin(Math.PI))
        console.log(Math.sin(Math.PI/2))
        console.log(Math.cos(Math.PI))
        console.log(Math.cos(Math.PI/2))
        console.log(Math.tan(Math.PI))
        console.log(Math.tan(Math.PI/2))
        // min and max 
        console.log(Math.min(23,26))
        console.log(Math.max(54,45))
    // random number 
    let r=Math.random()
        console.log(r)

        let a1=1
        let a2=100
        let r1=a1+(a2-a1)*Math.random()
        console.log(r1)











</script>
    <body>
        <h1>Math object in js</h1>
    </body>
</html>
