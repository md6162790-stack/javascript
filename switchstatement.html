<html>
    <script>
        function fun(){
            let date=18
            switch(date){
                case 1:
                    alert("first")
                    break
                case 15:
                    alert("second")
                    break
                case 18:
                    alert("correct")
                    break
                default: 
                alert("not matched")
            }
        }
    </script>
    <body>
        <h1>Switch statement</h1>
        <button onclick="fun()">click here</button>
    </body>
</html>
