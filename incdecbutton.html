<html>
    <script>
        var i=0
        function increment(){
            document.getElementById("ab").innerHTML=++i;
     
        }
          function decrement(){
            document.getElementById("ab").innerHTML=--i;
     
        }
        </script>
        <body>
            <div>
                <p id="ab">MTIEAT</p>
            <button id="bt1" onclick="increment()">+</button><br/>
                <button id="bt2" onclick="decrement()">-</button>
           
            </div>
            </body>
            </html>
